name = "showcase-signal-stack"
version = "0.1.0"
description = "Signal-stack showcase."
palette = "omarchy"
layout = "wide"

[frame]
background = "background"
border = "none"
glow = true
halo = false

[[visual.layers]]
type = "background"
source = "state"
color = "surface"
order = -10
x = 0.0
y = 0.0
width = 1.0
height = 1.0
gain = 1.0
opacity = 0.62
radius = 12

# Subtle accent breathing behind the waveform. An accent tint stays
# visible over the dark surface where a background-colored pulse
# would disappear into it.
[[visual.layers]]
type = "pulse"
source = "rms"
color = "accent"
order = 0
x = 0.03
y = 0.08
width = 0.94
height = 0.64
gain = 1.2
opacity = 0.14
radius = 10

[[visual.layers]]
type = "waveform"
source = "peak"
color = "accent"
order = 20
x = 0.03
y = 0.04
width = 0.94
height = 0.68
gain = 0.95
opacity = 1.0
mirror = true

[[visual.layers]]
type = "meter"
source = "peak"
color = "success"
secondary_color = "foreground"
order = 30
x = 0.03
y = 0.82
width = 0.94
height = 0.11
opacity = 1.0
radius = 2
