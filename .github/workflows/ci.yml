name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Three parallel jobs (fmt, clippy, test) instead of a single sequential `check`.
# Each runs on its own runner so a 4 min clippy run doesn't block a 30 s fmt
# check, and PR failures attribute to the specific gate that broke. Required
# status checks on dev (PR-time) and main (release-time) reference all three
# job names; if you rename or remove one here, update branch protection.

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libclang-dev cmake \
            libgtk-3-dev libglib2.0-dev libx11-dev libxi-dev libxtst-dev

      - name: cargo clippy -- -D warnings
        run: cargo clippy --all-targets --no-deps -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libclang-dev cmake \
            libgtk-3-dev libglib2.0-dev libx11-dev libxi-dev libxtst-dev

      - name: cargo test
        run: cargo test

  # macOS-only modules (src/menubar.rs, src/hotkey_macos.rs) are behind
  # `#[cfg(target_os = "macos")]`, so the three jobs above never compile a line
  # of them. build-macos.yml does, but only on tags and rc/* branches, which
  # means macOS code reaches a release branch without ever having been
  # typechecked during review. #576 shipped that way: a config-rewriting bug in
  # the menu bar that no Linux job could see.
  #
  # This is a check, not a build: no signing, no notarization, no universal
  # binary, no packaging. It exists to make macOS-only code fail in the PR that
  # writes it.
  macos-check:
    name: macos-check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: cargo clippy (macOS)
        run: cargo clippy --all-targets --no-deps -- -D warnings

      - name: cargo test (macOS)
        run: cargo test

  # Aggregator job — branch protection only needs to require `ci-success`.
  # Adding/removing parallel checks above just updates the `needs:` list;
  # the protection rule never needs to be touched.
  ci-success:
    name: ci-success
    needs: [fmt, clippy, test, macos-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        run: |
          set -e
          fmt='${{ needs.fmt.result }}'
          clippy='${{ needs.clippy.result }}'
          test='${{ needs.test.result }}'
          macos='${{ needs.macos-check.result }}'
          echo "fmt:         $fmt"
          echo "clippy:      $clippy"
          echo "test:        $test"
          echo "macos-check: $macos"
          if [[ "$fmt" != success || "$clippy" != success || "$test" != success \
                || "$macos" != success ]]; then
            echo "::error::One or more required jobs failed"
            exit 1
          fi
          echo "All required jobs succeeded."
